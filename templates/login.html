<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in | Helmet Compliance Monitor</title>
<link rel="icon" href="/static/logo.svg" type="image/svg+xml">
<style>
  :root { --bg:#0e1116; --panel:#171c24; --line:#2a323f; --text:#e7e9ee; --muted:#98a2b3; --amber:#f2b134; --bad:#ff7a7f; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text);
         font-family:Bahnschrift, "Segoe UI", system-ui, sans-serif; }
  main { width:min(380px, 92vw); }
  h1 { font-size:26px; font-weight:600; margin:0 0 6px; letter-spacing:.2px; }
  p.sub { color:var(--muted); margin:0 0 26px; }
  .road { height:6px; margin-bottom:22px; background:repeating-linear-gradient(90deg,var(--amber) 0 22px,transparent 22px 40px); opacity:.9; }
  form { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:24px; }
  label { display:block; font-size:13px; color:var(--muted); margin-bottom:6px; }
  input { width:100%; padding:11px 12px; margin-bottom:16px; background:#0b0e13; color:var(--text);
          border:1px solid var(--line); border-radius:6px; font:inherit; }
  input:focus, button:focus-visible { outline:2px solid var(--amber); outline-offset:1px; }
  button { width:100%; padding:11px; border:0; border-radius:6px; background:var(--amber); color:#1a1405; font:inherit; font-weight:600; cursor:pointer; }
  .err { color:var(--bad); font-size:14px; margin:0 0 14px; }
</style>
</head>
<body>
<main>
  <div class="road"></div>
  <img src="/static/logo.svg" alt="" width="56" height="56" style="display:block;margin-bottom:12px">
  <h1>Helmet Compliance Monitor</h1>
  <p class="sub">Sign in with the account your administrator created.</p>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    {% if error %}<p class="err" role="alert">{{ error }}</p>{% endif %}
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="username" required maxlength="254">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
  </form>
</main>
</body>
</html>
